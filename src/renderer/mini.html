<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Aero Music</title>
  <style>
    :root {
      --tint: linear-gradient(160deg, rgba(150,210,245,.55), rgba(70,140,200,.45));
      --solid: linear-gradient(160deg, #a8d3f0, #5c97c6);
      --panel: linear-gradient(rgba(255,255,255,.88), rgba(232,243,252,.82));
      --panel-border: rgba(255,255,255,.95);
      --text: #10294a;
      --sub: #4b5d70;
      --track: linear-gradient(#c9d6e3, #e9f0f7);
    }
    /* macOS vibrancy is greyer than acrylic, so the tint carries more of the colour. */
    html.mac { --tint: linear-gradient(160deg, rgba(130,195,240,.68), rgba(50,120,190,.66)); }
    @media (prefers-color-scheme: dark) {
      :root {
        --tint: linear-gradient(160deg, rgba(20,40,70,.6), rgba(5,12,24,.7));
        --solid: linear-gradient(160deg, #1d3350, #070d18);
        --panel: linear-gradient(rgba(16,30,50,.86), rgba(8,16,28,.86));
        --panel-border: rgba(120,190,255,.35);
        --text: #e8f4ff;
        --sub: #8fb3d4;
        --track: linear-gradient(#020509, #13202e);
      }
      html.mac { --tint: linear-gradient(160deg, rgba(24,52,90,.66), rgba(4,12,26,.78)); }
    }
    html, body { margin: 0; height: 100%; overflow: hidden; font: 12px "Segoe UI", Tahoma, sans-serif; user-select: none; cursor: default; }
    html.mac, html.mac body { font-family: "Lucida Grande", "Helvetica Neue", sans-serif; }
    body { background: var(--solid); }
    body.glass { background: var(--tint); }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,0) 40%),
        repeating-linear-gradient(118deg, rgba(255,255,255,0) 0 60px, rgba(255,255,255,.08) 60px 84px, rgba(255,255,255,0) 84px 150px);
    }
    .card {
      position: absolute; inset: 8px; border-radius: 6px; display: flex; gap: 12px; padding: 10px;
      background: var(--panel); border: 1px solid var(--panel-border);
      box-shadow: 0 2px 8px rgba(0,20,50,.3), inset 0 1px 0 rgba(255,255,255,.5);
      -webkit-app-region: drag;
    }
    .art, button, .bar { -webkit-app-region: no-drag; }
    .art { width: 128px; height: 128px; flex: none; border-radius: 4px; position: relative; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 2px 6px rgba(0,20,50,.4); background: linear-gradient(#e8eef5, #c9d6e4); cursor: pointer; }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 44%, rgba(255,255,255,0) 45%); }
    .right { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .title { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .controls { display: flex; align-items: center; gap: 6px; margin-top: auto; }
    button { border: none; background: none; padding: 0; cursor: default; display: grid; place-items: center; }
    svg { width: 1em; height: 1em; fill: currentColor; }
    .t { width: 30px; height: 30px; border-radius: 50%; font-size: 16px; color: var(--sub); }
    .t:hover { color: #1f7ad8; background: radial-gradient(circle, rgba(120,200,255,.45), rgba(120,200,255,0) 70%); }
    .play {
      width: 42px; height: 42px; border-radius: 50%; color: #fff; font-size: 19px;
      border: 1px solid #072a5a;
      background:
        radial-gradient(ellipse 72% 46% at 50% 16%, rgba(255,255,255,.9), rgba(255,255,255,.15) 80%, rgba(255,255,255,0) 81%),
        radial-gradient(circle at 50% 100%, #8ae4ff 0, #2b95e8 40%, #0d4f9f 75%, #072a5a 100%);
      box-shadow: 0 0 10px rgba(60,170,255,.55), inset 0 -3px 6px rgba(130,230,255,.6);
    }
    .play:hover { box-shadow: 0 0 16px rgba(90,200,255,.95), inset 0 -3px 6px rgba(170,240,255,.8); }
    .play svg { filter: drop-shadow(0 1px 1px rgba(0,20,60,.9)); }
    .heart.on { color: #ff4f78; filter: drop-shadow(0 0 3px rgba(255,80,120,.7)); }
    .open { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 3px; color: var(--sub); font-size: 12px; }
    .open:hover { background: rgba(120,190,255,.3); color: var(--text); }
    .seek { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--sub); font-size: 10px; font-variant-numeric: tabular-nums; }
    .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--track); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); position: relative; cursor: pointer; }
    .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(#b8f2ff, #3ec3ff 45%, #0f7fd8 55%, #3aa6f0); box-shadow: 0 0 5px rgba(70,190,255,.7); }
    .empty { color: var(--sub); margin: auto; text-align: center; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script src="mini.js"></script>
</body>
</html>
